<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词学习中心</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1>单词学习中心</h1>
        <p>集中管理背单词、练习测试与学习进度</p>
    </header>

    <main class="app-container">
        <section class="card" id="flashcard-section">
            <h2>背单词</h2>
            <div class="flashcard" id="flashcard" tabindex="0">
                <div class="flashcard__word" id="flashcard-word"></div>
                <div class="flashcard__detail" id="flashcard-detail"></div>
            </div>
            <div class="flashcard__controls">
                <button id="prev-word" class="button button--ghost">上一个</button>
                <button id="toggle-detail" class="button">显示释义</button>
                <button id="next-word" class="button button--ghost">下一个</button>
            </div>
            <div class="flashcard__actions">
                <button id="mark-known" class="button button--success">记住了</button>
                <button id="mark-review" class="button button--warning">稍后复习</button>
            </div>
        </section>

        <section class="card" id="quiz-section">
            <h2>练习测试</h2>
            <p class="section-tip">根据释义选择正确的单词，巩固记忆。</p>
            <div id="quiz-question" class="quiz-question"></div>
            <div id="quiz-options" class="quiz-options"></div>
            <div class="quiz-feedback" id="quiz-feedback"></div>
            <button id="next-question" class="button" disabled>下一题</button>
            <div class="quiz-summary">
                <span>测试题目：<strong id="quiz-count">0</strong></span>
                <span>答对：<strong id="quiz-correct">0</strong></span>
                <span>正确率：<strong id="quiz-accuracy">0%</strong></span>
            </div>
        </section>

        <section class="card" id="progress-section">
            <h2>学习进度</h2>
            <div class="progress-overview">
                <div class="progress-stat">
                    <span class="progress-stat__label">词库总数</span>
                    <span class="progress-stat__value" id="total-words">0</span>
                </div>
                <div class="progress-stat">
                    <span class="progress-stat__label">已掌握</span>
                    <span class="progress-stat__value" id="known-words">0</span>
                </div>
                <div class="progress-stat">
                    <span class="progress-stat__label">待复习</span>
                    <span class="progress-stat__value" id="review-words">0</span>
                </div>
            </div>
            <div class="progress-bars">
                <div class="progress-bar">
                    <span>掌握度</span>
                    <div class="progress-bar__track">
                        <div class="progress-bar__fill" id="mastery-bar"></div>
                    </div>
                </div>
                <div class="progress-bar">
                    <span>复习需求</span>
                    <div class="progress-bar__track">
                        <div class="progress-bar__fill progress-bar__fill--warning" id="review-bar"></div>
                    </div>
                </div>
            </div>
            <div class="progress-history">
                <h3>测试历史</h3>
                <ul id="quiz-history" class="quiz-history"></ul>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>坚持每日学习，逐步积累词汇量！</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
